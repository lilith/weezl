[package]
name = "wuffs-bench"
version = "0.0.0"
edition = "2021"
publish = false
description = "Benchmark harness comparing weezl Classic/Chunked against wuffs-v0.4 C LZW decoder. Internal use only, not published."

[lib]
path = "src/lib.rs"

[[bin]]
name = "profile_one"
path = "src/bin/profile_one.rs"

[dependencies]
weezl = { path = ".." }
png = "0.17"

[build-dependencies]
cc = "1.0"

[dev-dependencies]
zenbench = { path = "/home/lilith/work/zen/zenbench" }

[[bench]]
name = "wuffs_parity"
harness = false
path = "benches/wuffs_parity.rs"

[[bench]]
name = "l1_effect"
harness = false
path = "benches/l1_effect.rs"

[[bench]]
name = "tiff_parity"
harness = false
path = "benches/tiff_parity.rs"

[[bench]]
name = "reset_reuse"
harness = false
path = "benches/reset_reuse.rs"

[[bench]]
name = "full_image"
harness = false
path = "benches/full_image.rs"

[[bench]]
name = "alloc_cost"
harness = false
path = "benches/alloc_cost.rs"

# Retain debug info in release so callgrind can annotate per line.
[profile.release]
debug = 1

[[bin]]
